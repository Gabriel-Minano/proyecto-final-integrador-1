<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario de Usuario - Conquistadores Farma</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

	<div class="login-wrapper" style="background: var(--app-bg);">
		<div style="width: 100%; max-width: 580px;">

			<div class="app-header mb-4" style="border-radius: 12px;">
				<div class="header-brand">
					<i class="bi bi-capsule"></i>
					<span>Botica Conquistadores Farma</span>
				</div>
			</div>

			<div class="app-card">

				<div class="app-card-header">
					<i class="bi bi-shield-lock-fill"></i>
					<span th:text="${usuario.idUsuario != null} ? 'Editar Usuario' : 'Registrar Usuario'">
						Registrar Usuario
					</span>
				</div>

				<div class="app-card-body">

					<form th:action="${modoEdicion}
										? @{/usuarios/editarUsuario}
										: @{/usuarios/guardar}" 
				 		    th:object="${usuario}" method="post" class="app-form">

						<input type="hidden" th:field="*{idUsuario}">
						<input type="hidden" th:field="*{estado}">

						<div class="mb-3">
							<label class="form-label required">Nombre Completo</label>
							<input type="text" th:field="*{nombre}" th:readonly="${modoEdicion}"
								class="form-control campo-bloqueado" placeholder="Nombre del usuario" required>

							<span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="form-error">
							</span>
						</div>

						<div class="mb-3">
							<label class="form-label required">Username</label>

							<input type="text" th:field="*{username}" class="form-control"
								placeholder="Usuario de acceso al sistema" required>

							<span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error">
							</span>

							<div class="form-help">
								Nombre de usuario para iniciar sesión.
							</div>
						</div>

						<div class="mb-3">
							<label class="form-label required">Contraseña</label>

							<input type="password" minlength="8" th:field="*{password}" class="form-control"
								placeholder="••••••••" required>

							<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error">
							</span>
						</div>

						<div class="mb-3">
							<label class="form-label required">Rol</label>

							<select th:field="*{idRol}" class="form-select">
								<option value="">Seleccione un rol</option>

								<option th:each="rol : ${listaRoles}" th:value="${rol.idRol}" th:text="${rol.nombre}">
								</option>
							</select>

							<span th:if="${#fields.hasErrors('idRol')}" th:errors="*{idRol}" class="form-error">
							</span>

							<div class="form-help">
								El rol define los permisos del usuario en el sistema.
							</div>
						</div>

						<div class="form-actions">
							<a th:href="@{/usuarios}" class="btn btn-app-secondary">
								<i class="bi bi-x-lg"></i>
								Cancelar
							</a>

							<button type="submit" class="btn btn-app-primary">
								<i class="bi bi-check-lg"></i>
								Guardar
							</button>
						</div>

					</form>

				</div>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
