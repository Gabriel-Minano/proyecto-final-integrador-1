<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de Sesión - Conquistadores Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-capsule"></i>
                </div>
                <h3>Conquistadores Farma</h3>
                <p>Sistema de Inventario y Ventas</p>
            </div>
            <div class="login-body">

                <div th:if="${param.error}" class="alert alert-danger py-2 small d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos.
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2 small d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-check-circle-fill"></i> Ha cerrado sesión correctamente.
                </div>

                <form th:action="@{/login}" method="post" class="app-form">
                    <div class="mb-3">
                        <label class="form-label required">Usuario / Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" placeholder="Ingrese su usuario" required autocomplete="off">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label required">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-app-primary w-100 py-2 justify-content-center">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
                    </button>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
