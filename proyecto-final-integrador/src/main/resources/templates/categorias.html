<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Categorías - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

	<div class="app-body">
		<div th:replace="~{componentes/sidebar :: menuLateral('categorias')}"></div>

		<div class="app-main">
			<div th:replace="~{componentes/header :: topHeader}"></div>

			<div class="app-content">
				<h1 class="app-page-title"><i class="bi bi-tags-fill me-2 text-primary"></i>Categorías de Botica</h1>
				<p class="app-page-subtitle">Clasificación y agrupación para organizar los medicamentos y productos del catálogo.</p>

				<div th:if="${success}" th:text="${success}" class="alert alert-success py-2 small fw-bold mb-4" role="alert"></div>
				<div th:if="${error}" th:text="${error}" class="alert alert-danger py-2 small fw-bold mb-4" role="alert"></div>

				<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
					<form th:action="@{/categorias}" method="get" class="d-flex" style="max-width: 450px; flex:1;">
						<div class="input-group">
							<input type="text" name="palabraClave" th:value="${palabraClave}" class="form-control"
								placeholder="Buscar por nombre..." autocomplete="off" />
							<button type="submit" class="btn btn-app-primary">
								<i class="bi bi-search"></i> Buscar
							</button>
							<a th:href="@{/categorias}" class="btn btn-app-secondary">Limpiar</a>
						</div>
					</form>

					<a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/categorias/nuevo}" class="btn btn-app-primary">
						<i class="bi bi-plus-lg"></i> Nueva Categoría
					</a>
				</div>

				<div class="app-card">
					<div class="app-card-header">
						<i class="bi bi-tags-fill"></i> Listado de Categorías
					</div>
					<div class="table-responsive">
						<table class="app-table table table-hover align-middle text-center mb-0">
							<thead>
								<tr>
									<th style="width: 15%;">ID</th>
									<th class="text-start" style="width: 55%;">Nombre de la Categoría</th>
									<th sec:authorize="hasRole('ADMINISTRADOR')" style="width: 30%;">Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="cat : ${lista}">
									<td class="text-secondary fw-bold" th:text="${cat.idCategoria}"></td>
									<td class="text-start fw-semibold" th:text="${cat.nombre}"></td>
									<td sec:authorize="hasRole('ADMINISTRADOR')">
										<div class="d-flex justify-content-center gap-2">
											<a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}"
												class="btn btn-primary btn-sm fw-bold">
												<i class="bi bi-pencil-fill"></i> Editar
											</a>

											<a th:href="@{/categorias/eliminar/{id}(id=${cat.idCategoria})}"
												class="btn btn-warning btn-sm fw-bold"
												onclick="return confirm('¿Estás seguro de que deseas retirar esta categoría del sistema?');">
												<i class="bi bi-toggle-off"></i> Desactivar
											</a>

											<a th:href="@{/categorias/eliminar-fisico/{id}(id=${cat.idCategoria})}"
												class="btn btn-danger btn-sm fw-bold"
												onclick="return confirm('¿Estás seguro de que deseas eliminar esta categoría del sistema?');">
												<i class="bi bi-trash-fill"></i> Eliminar
											</a>
										</div>
									</td>
								</tr>
								<tr th:if="${lista.isEmpty()}">
									<td colspan="3" class="text-center text-muted py-5 fst-italic">
										<i class="bi bi-inbox d-block fs-1 mb-2 opacity-50"></i>
										No se encontraron categorías registradas en el sistema.
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
