<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Lista de Categorías - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{navBar.css}">

	<style>
		/* Estilos del área de contenido principal y cabecera */
		.main-content {
			flex: 1;
			padding: 30px;
			background-color: #ffffff;
			overflow-y: auto;
		}

		.top-header {
			display: flex;
			justify-content: flex-end;
			margin-bottom: 30px;
		}

		.user-profile {
			font-size: 1.3em;
			color: #333;
			display: flex;
			align-items: center;
			gap: 10px;
		}
	</style>
</head>

<body>

	<div class="layout-wrapper">

		<div th:replace="~{componentes/sidebar :: menuLateral('categorias')}"></div>

		<div class="main-content">

			<!--Cabecera con el ROL y USERNAME-->
			<div th:replace="~{componentes/header :: topHeader}"></div>

			<h2 class="text-secondary fw-bold mb-3">Categorías de Botica</h2>
			<p class="text-muted mb-4">Clasificación y agrupación para organizar los medicamentos y productos del
				catálogo.</p>

			<div th:if="${success}" th:text="${success}" class="alert alert-success py-2 small fw-bold mb-4 shadow-sm"
				role="alert"></div>
			<div th:if="${error}" th:text="${error}" class="alert alert-danger py-2 small fw-bold mb-4 shadow-sm"
				role="alert"></div>

			<div class="d-flex justify-content-between mb-4">

				<!--Barra de búsqueda por nombre-->
				<form th:action="@{/categorias}" method="get" class="d-flex" style="width: 450px">
					<div class="input-group shadow-sm">
						<input type="text" name="palabraClave" th:value="${palabraClave}" class="form-control"
							placeholder="Buscar por nombre..." autocomplete="off" />
						<button type="submit" class="btn btn-primary fw-bold px-3">
							Buscar
						</button>
						<a th:href="@{/categorias}" class="btn btn-outline-secondary">Limpiar</a>
					</div>
				</form>

				<a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/categorias/nuevo}"
					class="btn btn-success fw-bold px-4 py-2 shadow-sm">
					Crear Nueva Categoría
				</a>
			</div>

			<div class="card card-body border-0 shadow-sm p-0">
				<div class="table-responsive rounded border">
					<table class="table table-striped table-hover align-middle text-center mb-0">
						<thead class="table-secondary text-uppercase small fw-bold border-bottom">
							<tr>
								<th style="padding: 15px; width: 15%;">ID</th>
								<th class="text-start" style="width: 55%;">Nombre de la Categoría</th>
								<th sec:authorize="hasRole('ADMINISTRADOR')" style="width: 30%;">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="cat : ${lista}">
								<td class="text-secondary fw-bold" th:text="${cat.idCategoria}"></td>
								<td class="text-start fw-semibold text-dark fs-5" th:text="${cat.nombre}"></td>

								<td sec:authorize="hasRole('ADMINISTRADOR')">
									<div class="d-flex justify-content-center gap-2">
										<a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}"
											class="btn btn-warning btn-sm fw-bold shadow-sm" style="color: #664d03;">
											Editar
										</a>
										<a th:href="@{/categorias/eliminar/{id}(id=${cat.idCategoria})}"
											class="btn btn-danger btn-sm fw-bold shadow-sm"
											onclick="return confirm('¿Estás seguro de que deseas retirar esta categoría del sistema?');">
											Eliminar
										</a>
									</div>
								</td>
							</tr>
							<tr th:if="${lista.isEmpty()}">
								<td colspan="3" class="text-center text-muted py-5 fst-italic fs-5">
									No se encontraron categorías registradas en el sistema.
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
