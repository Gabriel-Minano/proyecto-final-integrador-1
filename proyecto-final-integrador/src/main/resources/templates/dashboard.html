<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Botica</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .filtro-container { margin-bottom: 20px; }
        
        /* Contenedor de las cajas de colores */
        .cards-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { 
            flex: 1; padding: 20px; border-radius: 8px; color: white; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; 
        }
        .card h3 { margin: 0; font-size: 1.2em; font-weight: normal; }
        .card .valor { font-size: 2em; font-weight: bold; margin-top: 10px; }
        
        /* Colores basados en tu prototipo */
        .bg-ingresos { background-color: #22c55e; } /* Verde */
        .bg-ventas { background-color: #3b82f6; }   /* Azul */
        .bg-clientes { background-color: #8b5cf6; } /* Morado */
        .bg-critico { background-color: #ef4444; }  /* Rojo */

        /* Layout inferior: Grafico y Alertas */
        .bottom-layout { display: flex; gap: 20px; }
        .chart-placeholder { flex: 2; background: #e5e5e5; padding: 20px; border-radius: 8px; height: 300px; display: flex; align-items: center; justify-content: center; color: #666; font-style: italic;}
        
        .alertas-panel { flex: 1; background: #e5e5e5; padding: 20px; border-radius: 8px; }
        .alerta-item { 
            background-color: #fca5a5; /* Rojo claro */
            padding: 10px; margin-bottom: 10px; border-radius: 5px; 
            border: 1px solid #f87171; color: #991b1b;
        }
    </style>
</head>
<body>

    <div class="filtro-container">
        <form th:action="@{/dashboard}" method="get">
            <label>Mes:</label>
            <select name="mes">
                <option value="1" th:selected="${mesSeleccionado == 1}">Enero</option>
                <option value="2" th:selected="${mesSeleccionado == 2}">Febrero</option>
                <option value="3" th:selected="${mesSeleccionado == 3}">Marzo</option>
                <option value="4" th:selected="${mesSeleccionado == 4}">Abril</option>
                <option value="5" th:selected="${mesSeleccionado == 5}">Mayo</option>
                <option value="6" th:selected="${mesSeleccionado == 6}">Junio</option>
                <option value="7" th:selected="${mesSeleccionado == 7}">Julio</option>
                <option value="8" th:selected="${mesSeleccionado == 8}">Agosto</option>
                <option value="9" th:selected="${mesSeleccionado == 9}">Septiembre</option>
                <option value="10" th:selected="${mesSeleccionado == 10}">Octubre</option>
                <option value="11" th:selected="${mesSeleccionado == 11}">Noviembre</option>
                <option value="12" th:selected="${mesSeleccionado == 12}">Diciembre</option>
            </select>
            
            <label>Año:</label>
            <select name="anio">
                <option value="2025" th:selected="${anioSeleccionado == 2025}">2025</option>
                <option value="2026" th:selected="${anioSeleccionado == 2026}">2026</option>
            </select>
            
            <button type="submit">Filtrar Datos</button>
        </form>
    </div>

    <div class="cards-container">
        <div class="card bg-ingresos">
            <h3>Ingresos</h3>
            <div class="valor">S/. <span th:text="${#numbers.formatDecimal(indicadores.ingresosMes, 1, 2)}">0.00</span></div>
        </div>
        <div class="card bg-ventas">
            <h3>Ventas</h3>
            <div class="valor" th:text="${indicadores.ventasMes}">0</div>
        </div>
        <div class="card bg-clientes">
            <h3>Clientes</h3>
            <div class="valor" th:text="${indicadores.clientesMes}">0</div>
        </div>
        <div class="card bg-critico">
            <h3>Stock Crítico</h3>
            <div class="valor" th:text="${indicadores.cantCriticos}">0</div>
        </div>
    </div>

    <div class="bottom-layout">
        <div class="chart-placeholder">
            [ Espacio reservado para el Gráfico de Barras ]
        </div>

        <div class="alertas-panel">
            <h3 style="text-align: center; margin-top: 0;">Alertas</h3>
            
            <div th:each="prod : ${indicadores.alertasAgotados}" class="alerta-item">
                <strong>Sin stock:</strong> <span th:text="${prod.nombre}"></span>
            </div>
            
            <div th:each="prod : ${indicadores.alertasVencidos}" class="alerta-item">
                <strong>Vencido:</strong> <span th:text="${prod.nombre}"></span>
            </div>

            <div th:if="${indicadores.alertasAgotados.isEmpty() and indicadores.alertasVencidos.isEmpty()}" 
                 style="text-align: center; color: green; font-weight: bold;">
                Todo en orden. No hay alertas activas.
            </div>
        </div>
    </div>

</body>
</html>
