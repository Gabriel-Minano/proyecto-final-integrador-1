<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Botica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{navbar.css}" />
    <style>
      /* =========================================
           ESTILOS DEL CONTENIDO PRINCIPAL
           ========================================= */
      .main-content {
        flex: 1;
        padding: 30px;
        background-color: #ffffff;
        overflow-y: auto;
      }

      .top-header {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 30px;
      }

      .user-profile {
        font-size: 1.3em;
        color: #333;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .filtro-container {
        margin-bottom: 30px;
      }

      .cards-container {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
      }

      .card {
        flex: 1;
        padding: 25px 20px;
        border-radius: 8px;
        color: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: left;
      }

      .card h3 {
        margin: 0;
        font-size: 1.5em;
        font-weight: normal;
      }

      .card .valor {
        font-size: 2.2em;
        font-weight: bold;
        margin-top: 15px;
      }

      .bg-ingresos {
        background-color: #22c55e;
      }

      .bg-ventas {
        background-color: #3b82f6;
      }

      .bg-clientes {
        background-color: #8b5cf6;
      }

      .bg-critico {
        background-color: #ef4444;
      }

      .bottom-layout {
        display: flex;
        gap: 20px;
      }

      .chart-placeholder {
        flex: 2;
        background: #e5e5e5;
        padding: 20px;
        border-radius: 8px;
        height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-style: italic;
        font-size: 1.2em;
      }

      .alertas-panel {
        flex: 1;
        background: #e5e5e5;
        padding: 20px;
        border-radius: 8px;
      }

      .alertas-panel h3 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 20px;
      }

      .alerta-item {
        background-color: #e5989b;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 5px;
        border: 1px solid #b56576;
        color: #540b0e;
        font-size: 1.1em;
      }
    </style>
  </head>

  <body>
    <div class="layout-wrapper">
      <!--Menú desplegable, se encuentra en templates/componentes/sidebar.html-->
      <div
        th:replace="~{componentes/sidebar :: menuLateral('dashboard')}"
      ></div>
      <div class="main-content">
        <!--Cabecera con el ROL y USERNAME-->
        <div th:replace="~{componentes/header :: topHeader}"></div>

        <div class="filtro-container">
          <form th:action="@{/dashboard}" method="get">
            <label style="font-size: 1.1em; margin-right: 5px">Mes:</label>
            <select
              name="mes"
              style="font-size: 1.1em; padding: 5px; margin-right: 15px"
            >
              <option value="1" th:selected="${mesSeleccionado == 1}">
                Enero
              </option>
              <option value="2" th:selected="${mesSeleccionado == 2}">
                Febrero
              </option>
              <option value="3" th:selected="${mesSeleccionado == 3}">
                Marzo
              </option>
              <option value="4" th:selected="${mesSeleccionado == 4}">
                Abril
              </option>
              <option value="5" th:selected="${mesSeleccionado == 5}">
                Mayo
              </option>
              <option value="6" th:selected="${mesSeleccionado == 6}">
                Junio
              </option>
              <option value="7" th:selected="${mesSeleccionado == 7}">
                Julio
              </option>
              <option value="8" th:selected="${mesSeleccionado == 8}">
                Agosto
              </option>
              <option value="9" th:selected="${mesSeleccionado == 9}">
                Septiembre
              </option>
              <option value="10" th:selected="${mesSeleccionado == 10}">
                Octubre
              </option>
              <option value="11" th:selected="${mesSeleccionado == 11}">
                Noviembre
              </option>
              <option value="12" th:selected="${mesSeleccionado == 12}">
                Diciembre
              </option>
            </select>

            <label style="font-size: 1.1em; margin-right: 5px">Año:</label>
            <select
              name="anio"
              style="font-size: 1.1em; padding: 5px; margin-right: 15px"
            >
              <option
                th:each="anio : ${anios}"
                th:value="${anio}"
                th:text="${anio}"
                th:selected="${anioSeleccionado == anio}"
              ></option>
            </select>

            <button type="submit" style="font-size: 1.1em; padding: 5px 15px">
              Filtrar
            </button>
          </form>
        </div>

        <div class="cards-container">
          <div class="card bg-ingresos">
            <h3>Ingresos</h3>
            <div class="valor">
              S/.
              <span
                th:text="${#numbers.formatDecimal(indicadores.ingresosMes, 1, 2)}"
                >0.00</span
              >
            </div>
          </div>
          <div class="card bg-ventas">
            <h3>Ventas</h3>
            <div class="valor" th:text="${indicadores.ventasMes}">0</div>
          </div>
          <div class="card bg-clientes">
            <h3>Clientes</h3>
            <div class="valor" th:text="${indicadores.clientesMes}">0</div>
          </div>
          <div class="card bg-critico">
            <h3>Stock Critico</h3>
            <div class="valor" th:text="${indicadores.cantCriticos}">0</div>
          </div>
        </div>

        <div class="bottom-layout">
          <div class="chart-placeholder">
            <canvas id="ventasChart"></canvas>
          </div>

          <div class="alertas-panel">
            <h3>Alertas</h3>

            <div
              th:each="prod : ${indicadores.alertasAgotados}"
              class="alerta-item"
            >
              Sin stock: <span th:text="${prod.nombre}"></span>
            </div>

            <div
              th:each="prod : ${indicadores.alertasVencidos}"
              class="alerta-item"
            >
              Vencido: <span th:text="${prod.nombre}"></span>
            </div>

            <div
              th:if="${indicadores.alertasAgotados.isEmpty() and indicadores.alertasVencidos.isEmpty()}"
              style="
                text-align: center;
                color: #2d6a4f;
                font-weight: bold;
                font-size: 1.1em;
                padding: 20px 0;
              "
            >
              No hay alertas activas.
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <!--js para manerjar el grafico de ventas por dia con charts js-->
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script th:inline="javascript">
    // Datos enviados desde Spring
    let ventasPorDia = /*[[${ventasPorDia}]]*/ [];

    // Arrays para Chart.js
    let labels = [];
    let data = [];

    ventasPorDia.forEach((v) => {
      labels.push("Día " + v.dia);
      data.push(v.total);
    });

    // Crear gráfico
    const ctx = document.getElementById("ventasChart").getContext("2d");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Ingresos del día",
            data: data,
            borderWidth: 1,
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });
  </script>
</html>
