<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dashboard - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

	<div class="app-body">
		<!--Menú lateral-->
		<div th:replace="~{componentes/sidebar :: menuLateral('dashboard')}"></div>

		<div class="app-main">
			<!--Barra superior azul-->
			<div th:replace="~{componentes/header :: topHeader}"></div>

			<div class="app-content">
				<h1 class="app-page-title"><i class="bi bi-grid-1x2-fill me-2 text-primary"></i>Dashboard</h1>
				<p class="app-page-subtitle">Resumen del rendimiento de la botica en el periodo seleccionado.</p>

				<!-- Filtro de periodo -->
				<div class="app-card mb-4">
					<div class="app-card-header">
						<i class="bi bi-funnel-fill"></i> Filtro de Periodo
					</div>
					<div class="app-card-body">
						<form th:action="@{/dashboard}" method="get" class="row g-3 align-items-end">
							<div class="col-md-4">
								<label class="form-label fw-bold small text-secondary">Mes</label>
								<select name="mes" class="form-select">
									<option value="1" th:selected="${mesSeleccionado == 1}">Enero</option>
									<option value="2" th:selected="${mesSeleccionado == 2}">Febrero</option>
									<option value="3" th:selected="${mesSeleccionado == 3}">Marzo</option>
									<option value="4" th:selected="${mesSeleccionado == 4}">Abril</option>
									<option value="5" th:selected="${mesSeleccionado == 5}">Mayo</option>
									<option value="6" th:selected="${mesSeleccionado == 6}">Junio</option>
									<option value="7" th:selected="${mesSeleccionado == 7}">Julio</option>
									<option value="8" th:selected="${mesSeleccionado == 8}">Agosto</option>
									<option value="9" th:selected="${mesSeleccionado == 9}">Septiembre</option>
									<option value="10" th:selected="${mesSeleccionado == 10}">Octubre</option>
									<option value="11" th:selected="${mesSeleccionado == 11}">Noviembre</option>
									<option value="12" th:selected="${mesSeleccionado == 12}">Diciembre</option>
								</select>
							</div>
							<div class="col-md-4">
								<label class="form-label fw-bold small text-secondary">Año</label>
								<select name="anio" class="form-select">
                  <option
                    th:each="anio : ${anios}"
                    th:value="${anio}"
                    th:text="${anio}"
                    th:selected="${anioSeleccionado == anio}">
                  </option>
								</select>
							</div>
							<div class="col-md-4 d-flex justify-content-end">
								<button type="submit" class="btn btn-app-primary">
									<i class="bi bi-search"></i> Filtrar
								</button>
							</div>
						</form>
					</div>
				</div>

				<!-- Indicadores principales -->
				<div class="row g-3 mb-4">
					<div class="col-md-3">
						<div class="dash-card bg-ingresos">
							<i class="bi bi-cash-coin dash-icon"></i>
							<div class="dash-label">Ingresos del Mes</div>
							<p class="dash-value">S/. <span th:text="${#numbers.formatDecimal(indicadores.ingresosMes, 1, 2)}">0.00</span></p>
						</div>
					</div>
					<div class="col-md-3">
						<div class="dash-card bg-ventas">
							<i class="bi bi-receipt dash-icon"></i>
							<div class="dash-label">Ventas Realizadas</div>
							<p class="dash-value" th:text="${indicadores.ventasMes}">0</p>
						</div>
					</div>
					<div class="col-md-3">
						<div class="dash-card bg-clientes">
							<i class="bi bi-people dash-icon"></i>
							<div class="dash-label">Clientes Atendidos</div>
							<p class="dash-value" th:text="${indicadores.clientesMes}">0</p>
						</div>
					</div>
					<div class="col-md-3">
						<div class="dash-card bg-critico">
							<i class="bi bi-exclamation-triangle dash-icon"></i>
							<div class="dash-label">Stock Crítico</div>
							<p class="dash-value" th:text="${indicadores.cantCriticos}">0</p>
						</div>
					</div>
				</div>

				<!-- Gráfico y Alertas -->
				<div class="row g-3">
					<div class="col-lg-8">
						<div class="chart-container">
							<div class="chart-title">
								<i class="bi bi-bar-chart-fill"></i> Ventas por Día
							</div>
							<div class="chart-body">
								<canvas id="ventasChart"></canvas>
							</div>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="alertas-panel">
							<div class="panel-title">
								<i class="bi bi-bell-fill"></i> Alertas
							</div>
							<div class="panel-body">
								<div th:each="prod : ${indicadores.alertasAgotados}" class="alerta-item">
									<i class="bi bi-x-circle-fill me-1"></i> Sin stock: <span th:text="${prod.nombre}"></span>
								</div>
								<div th:each="prod : ${indicadores.alertasVencidos}" class="alerta-item">
									<i class="bi bi-clock-fill me-1"></i> Vencido: <span th:text="${prod.nombre}"></span>
								</div>
								<div th:if="${indicadores.alertasAgotados.isEmpty() and indicadores.alertasVencidos.isEmpty()}"
									class="text-center text-success fw-bold py-4">
									<i class="bi bi-check-circle-fill fs-3 d-block mb-2"></i>
									No hay alertas activas.
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

	<script th:inline="javascript">
		let ventasPorDia = /*[[${ventasPorDia}]]*/[];
		let labels = [];
		let data = [];
		ventasPorDia.forEach(v => {
			labels.push("Día " + v.dia);
			data.push(v.total);
		});
		const ctx = document.getElementById('ventasChart').getContext('2d');
		new Chart(ctx, {
			type: 'bar',
			data: {
				labels: labels,
				datasets: [{
					label: 'Ventas por día',
					data: data,
					backgroundColor: 'rgba(13, 110, 253, 0.7)',
					borderColor: '#0d6efd',
					borderWidth: 1,
					borderRadius: 4
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: { legend: { display: false } },
				scales: {
					y: { beginAtZero: true, grid: { color: '#f0f0f0' } },
					x: { grid: { display: false } }
				}
			}
		});
	</script>

</body>

</html>
