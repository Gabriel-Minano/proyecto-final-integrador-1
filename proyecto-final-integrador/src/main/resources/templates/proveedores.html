<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores - Conquistadores Farma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

    <div class="app-body">

        <div th:replace="~{componentes/sidebar :: menuLateral('proveedores')}"></div>

        <div class="app-main">

            <div th:replace="~{componentes/header :: topHeader}"></div>

            <div class="app-content">

                <h1 class="app-page-title">
                    <i class="bi bi-truck me-2 text-primary"></i>
                    Directorio de Proveedores
                </h1>

                <p class="app-page-subtitle">
                    Gestión de laboratorios y empresas distribuidoras de la botica.
                </p>

                <div th:if="${success}" th:text="${success}" class="alert alert-success py-2 small fw-bold mb-4"
                    role="alert">
                </div>

                <div th:if="${error}" th:text="${error}" class="alert alert-danger py-2 small fw-bold mb-4"
                    role="alert">
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">

                    <form th:action="@{/proveedores}" method="get" class="d-flex" style="max-width: 500px; flex:1;">

                        <div class="input-group">
                            <input type="text" name="palabraClave" th:value="${palabraClave}" class="form-control"
                                placeholder="Buscar por RUC o razón social..." autocomplete="off" maxlength="11">

                            <button type="submit" class="btn btn-app-primary">
                                <i class="bi bi-search"></i>
                                Buscar
                            </button>

                            <a th:href="@{/proveedores}" class="btn btn-app-secondary">
                                Limpiar
                            </a>
                        </div>

                    </form>

                    <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/proveedores/nuevo}"
                        class="btn btn-app-primary">
                        <i class="bi bi-plus-lg"></i>
                        Nuevo Proveedor
                    </a>

                </div>

                <div class="app-card">

                    <div class="app-card-header">
                        <i class="bi bi-truck"></i>
                        Listado de Proveedores
                    </div>

                    <div class="table-responsive">

                        <table class="app-table table table-hover align-middle text-center mb-0">

                            <thead>
                                <tr>
                                    <th style="width: 8%;">ID</th>
                                    <th class="text-start" style="width: 25%;">Razón Social / Nombre</th>
                                    <th style="width: 15%;">RUC</th>
                                    <th style="width: 15%;">Teléfono</th>
                                    <th class="text-start" style="width: 22%;">Dirección</th>
                                    <th sec:authorize="hasRole('ADMINISTRADOR')" style="width: 15%;">Acciones</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="prov : ${lista}">
                                    <td class="text-secondary fw-bold" th:text="${prov.idProveedor}">
                                    </td>

                                    <td class="text-start fw-semibold" th:text="${prov.nombre}">
                                    </td>

                                    <td class="text-muted fw-semibold" th:text="${prov.ruc}">
                                    </td>

                                    <td th:text="${prov.telefono}"></td>

                                    <td class="text-start text-muted small" th:text="${prov.direccion}">
                                    </td>

                                    <td sec:authorize="hasRole('ADMINISTRADOR')">

                                        <div class="d-flex justify-content-center gap-2">

                                            <a th:href="@{/proveedores/editar/{id}(id=${prov.idProveedor})}"
                                                class="btn btn-primary btn-sm fw-bold">
                                                <i class="bi bi-pencil-fill"></i>
                                                Editar
                                            </a>

                                            <a th:href="@{/proveedores/eliminar/{id}(id=${prov.idProveedor})}"
                                                class="btn btn-warning btn-sm fw-bold"
                                                onclick="return confirm('¿Estás seguro de que deseas retirar a este proveedor del sistema?');">
                                                <i class="bi bi-toggle-off"></i>
                                                Desactivar
                                            </a>

                                            <a th:href="@{/proveedores/eliminar-fisico/{id}(id=${prov.idProveedor})}"
                                                class="btn btn-danger btn-sm fw-bold"
                                                onclick="return confirm('¿Estás seguro de que deseas eliminar a este proveedor del sistema?');">
                                                <i class="bi bi-trash-fill"></i>
                                                Eliminar
                                            </a>

                                        </div>

                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(lista)}">
                                    <td colspan="6" class="text-center text-muted py-5 fst-italic">

                                        <i class="bi bi-inbox d-block fs-1 mb-2 opacity-50"></i>

                                        No se encontraron proveedores registrados en el sistema.

                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
