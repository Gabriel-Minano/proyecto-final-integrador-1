<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Personal de la Botica - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{navBar.css}">

	<style>
		/* Estilos del área de contenido principal y cabecera */
		.main-content {
			flex: 1;
			padding: 30px;
			background-color: #ffffff;
			overflow-y: auto;
		}

		.top-header {
			display: flex;
			justify-content: flex-end;
			margin-bottom: 30px;
		}

		.user-profile {
			font-size: 1.3em;
			color: #333;
			display: flex;
			align-items: center;
			gap: 10px;
		}
	</style>
</head>

<body>

	<div class="layout-wrapper">

		<div th:replace="~{componentes/sidebar :: menuLateral('usuarios')}"></div>

		<div class="main-content">

			<!--Cabecera con el ROL y USERNAME-->
			<div th:replace="~{componentes/header :: topHeader}"></div>

			<h2 class="text-secondary fw-bold mb-3">Personal de la Botica</h2>
			<p class="text-muted mb-4">Gestión de empleados, cajeros y administradores con acceso al sistema.</p>

			<div th:if="${success}" th:text="${success}" class="alert alert-success py-2 small fw-bold mb-4 shadow-sm"
				role="alert"></div>
			<div th:if="${error}" th:text="${error}" class="alert alert-danger py-2 small fw-bold mb-4 shadow-sm"
				role="alert"></div>

			<div class="d-flex justify-content-between mb-4">
				<!--Barra de busqueda por rol o nombre-->
				<form th:action="@{/usuarios}" method="get" class="d-flex" style="width: 550px">
					<div class="input-group shadow-sm">
						<input type="text" name="palabraClave" th:value="${palabraClave}" class="form-control"
							placeholder="Buscar por rol o nombre..." autocomplete="off" />
						<button type="submit" class="btn btn-primary fw-bold px-3">
							Buscar
						</button>
						<a th:href="@{/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
					</div>
				</form>
				<a th:href="@{/usuarios/nuevo}" class="btn btn-success fw-bold px-4 py-2 shadow-sm">
					Registrar Empleado
				</a>
			</div>

			<div class="card card-body border-0 shadow-sm p-0">
				<div class="table-responsive rounded border">
					<table class="table table-striped table-hover align-middle text-center mb-0">
						<thead class="table-secondary text-uppercase small fw-bold border-bottom">
							<tr>
								<th class="text-start ps-4" style="padding: 15px;">Nombre Completo</th>
								<th>Username (Usuario)</th>
								<th>Rol en el Sistema</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="usu : ${lista}">
								<td class="text-start ps-4 fw-semibold text-dark fs-6" th:text="${usu.nombre}"></td>
								<td class="text-secondary fw-bold" th:text="${usu.username}"></td>

								<td>
									<span
										th:classappend="${usu.rol == 'ADMINISTRADOR'} ? 'bg-primary' : 'bg-info text-dark'"
										class="badge rounded-pill px-3 py-2 fw-bold shadow-sm" th:text="${usu.rol}">
									</span>
								</td>

								<td>
									<div class="d-flex justify-content-center gap-2">
										<a th:href="@{/usuarios/editar/{id}(id=${usu.idUsuario})}"
											class="btn btn-warning btn-sm fw-bold shadow-sm" style="color: #664d03;">
											Editar
										</a>
										<a th:href="@{/usuarios/eliminar/{id}(id=${usu.idUsuario})}"
											class="btn btn-danger btn-sm fw-bold shadow-sm"
											onclick="return confirm('¿Estás seguro de que deseas retirar a este usuario del sistema?');">
											Eliminar
										</a>
									</div>
								</td>
							</tr>
							<tr th:if="${lista.isEmpty()}">
								<td colspan="4" class="text-center text-muted py-5 fst-italic fs-5">
									No se encontró personal registrado en el sistema.
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
