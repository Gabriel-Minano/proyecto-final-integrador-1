<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

	<div th:fragment="topHeader" class="top-header">
		<div class="user-profile fw-bold text-secondary">
			<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="text-primary"
				viewBox="0 0 16 16">
				<path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
				<path fill-rule="evenodd"
					d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
			</svg>
			<span th:text="${#strings.replace(#authentication.principal.authorities[0].authority, 'ROLE_', '')} + ' | ' + ${#strings.toUpperCase(#authentication.name)}">
				ADMIN | USUARIO
			</span>
		</div>
	</div>

</body>

</html>
