<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

	<nav th:fragment="menuLateral(vistaActiva)" class="app-sidebar">
		<div class="sidebar-brand">
			<div class="brand-icon"><i class="bi bi-capsule"></i></div>
			<div class="brand-text">
				Conquistadores Farma
				<small>Sistema de Gestión</small>
			</div>
		</div>

		<ul class="sidebar-nav">
			<li sec:authorize="hasRole('ADMINISTRADOR')" th:classappend="${vistaActiva == 'dashboard'} ? 'active' : ''">
				<a th:href="@{/dashboard}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
			</li>
			<li th:classappend="${vistaActiva == 'caja'} ? 'active' : ''">
				<a th:href="@{/ventas/nuevo}"><i class="bi bi-cart-check-fill"></i> Realizar Venta</a>
			</li>
			<li th:classappend="${vistaActiva == 'ventas'} ? 'active' : ''">
				<a th:href="@{/ventas}"><i class="bi bi-receipt-cutoff"></i> Ventas</a>
			</li>
			<li th:classappend="${vistaActiva == 'productos'} ? 'active' : ''">
				<a th:href="@{/productos}"><i class="bi bi-box-seam-fill"></i> Productos</a>
			</li>
			<li th:classappend="${vistaActiva == 'clientes'} ? 'active' : ''">
				<a th:href="@{/clientes}"><i class="bi bi-people-fill"></i> Clientes</a>
			</li>
			<li th:classappend="${vistaActiva == 'proveedores'} ? 'active' : ''">
				<a th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a>
			</li>
			<li th:classappend="${vistaActiva == 'categorias'} ? 'active' : ''">
				<a th:href="@{/categorias}"><i class="bi bi-tags-fill"></i> Categorías</a>
			</li>
			<li sec:authorize="hasRole('ADMINISTRADOR')" th:classappend="${vistaActiva == 'usuarios'} ? 'active' : ''">
				<a th:href="@{/usuarios}"><i class="bi bi-shield-lock-fill"></i> Usuarios</a>
			</li>
		</ul>

		<div class="sidebar-footer">
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="logout-btn">
					<i class="bi bi-box-arrow-left"></i> Cerrar Sesión
				</button>
			</form>
		</div>
	</nav>

</body>

</html>
