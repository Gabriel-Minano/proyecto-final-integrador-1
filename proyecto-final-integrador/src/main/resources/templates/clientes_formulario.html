<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario Cliente - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

	<div class="login-wrapper" style="background: var(--app-bg);">
		<div style="width: 100%; max-width: 650px;">

			<div class="app-header mb-4" style="border-radius: 12px;">
				<div class="header-brand">
					<i class="bi bi-capsule"></i>
					<span>Botica Conquistadores Farma</span>
				</div>
			</div>

			<div class="app-card">
				<div class="app-card-header">
					<i class="bi bi-people-fill"></i>
					<span th:text="${cliente.idCliente != null} ? 'Editar Cliente' : 'Registrar Cliente'">Registrar
						Cliente</span>
				</div>
				<div class="app-card-body">
					<form th:action="${cliente.idCliente != null} ?
					                 @{/clientes/editarCliente} :
					                 @{/clientes/guardar}" th:object="${cliente}" method="post" class="app-form">
						<input type="hidden" th:field="*{idCliente}">
						<input th:if="${cliente.idCliente == null}" type="hidden" th:field="*{estado}" th:value="true">

						<div class="row g-3">
							<div class="col-md-6 mb-3">
								<label class="form-label required">Nombre</label>
								<input type="text" th:readonly="${modoEdicion}" th:field="*{nombre}"
									class="form-control campo-bloqueado" placeholder="Nombre del cliente">
								<span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"
									class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Apellido</label>
								<input type="text" th:readonly="${modoEdicion}" th:field="*{apellido}"
									class="form-control campo-bloqueado" placeholder="Apellido del cliente">
								<span th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"
									class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Documento (DNI/RUC)</label>
								<input type="number" th:readonly="${modoEdicion}" th:field="*{documento}"
									class="form-control campo-bloqueado" placeholder="Ingrese el DNI o RUC del cliente">
								<span th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"
									class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">Teléfono</label>
								<input type="number" th:field="*{telefono}" class="form-control"
									placeholder="Ej. 987654321">
								<span th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"
									class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">Correo Electrónico</label>
								<input type="email" th:field="*{correo}" class="form-control"
									placeholder="correo@ejemplo.com">
								<span th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"
									class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">Dirección</label>
								<input type="text" th:field="*{direccion}" class="form-control"
									placeholder="Dirección del cliente">
								<span th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"
									class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3" th:if="${cliente.idCliente != null}">
								<label class="form-label">Estado en el Sistema</label>
								<select th:field="*{estado}" class="form-select">
									<option th:value="true">Activo</option>
									<option th:value="false">Inactivo</option>
								</select>
							</div>
						</div>

						<div class="form-actions">
							<a th:href="@{/clientes}" class="btn btn-app-secondary">
								<i class="bi bi-x-lg"></i> Cancelar
							</a>
							<button type="submit" class="btn btn-app-primary">
								<i class="bi bi-check-lg"></i> Guardar
							</button>
						</div>
					</form>
				</div>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
