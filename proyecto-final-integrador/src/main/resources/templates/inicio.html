<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inicio - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

	<div class="app-body">
		<div th:replace="~{componentes/sidebar :: menuLateral('inicio')}"></div>

		<div class="app-main">
			<div th:replace="~{componentes/header :: topHeader}"></div>

			<div class="app-content">
				<div class="text-center py-5">
					<div class="mb-4">
						<i class="bi bi-capsule text-primary" style="font-size: 64px;"></i>
					</div>
					<h1 class="app-page-title mb-2">Bienvenido al Sistema</h1>
					<p class="app-page-subtitle mb-5">Seleccione un módulo para comenzar a trabajar.</p>

					<div class="row g-3 justify-content-center" style="max-width: 800px; margin: 0 auto;">
						<div class="col-6 col-md-4">
							<a th:href="@{/categorias}" class="text-decoration-none">
								<div class="app-card text-center p-4">
									<i class="bi bi-tags-fill text-primary fs-1 mb-2 d-block"></i>
									<span class="fw-bold text-dark">Categorías</span>
								</div>
							</a>
						</div>
						<div class="col-6 col-md-4">
							<a th:href="@{/productos}" class="text-decoration-none">
								<div class="app-card text-center p-4">
									<i class="bi bi-box-seam-fill text-primary fs-1 mb-2 d-block"></i>
									<span class="fw-bold text-dark">Productos</span>
								</div>
							</a>
						</div>
						<div class="col-6 col-md-4">
							<a th:href="@{/proveedores}" class="text-decoration-none">
								<div class="app-card text-center p-4">
									<i class="bi bi-truck text-primary fs-1 mb-2 d-block"></i>
									<span class="fw-bold text-dark">Proveedores</span>
								</div>
							</a>
						</div>
						<div class="col-6 col-md-4">
							<a th:href="@{/clientes}" class="text-decoration-none">
								<div class="app-card text-center p-4">
									<i class="bi bi-people-fill text-primary fs-1 mb-2 d-block"></i>
									<span class="fw-bold text-dark">Clientes</span>
								</div>
							</a>
						</div>
						<div class="col-6 col-md-4">
							<a th:href="@{/usuarios}" class="text-decoration-none">
								<div class="app-card text-center p-4">
									<i class="bi bi-shield-lock-fill text-primary fs-1 mb-2 d-block"></i>
									<span class="fw-bold text-dark">Usuarios</span>
								</div>
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
