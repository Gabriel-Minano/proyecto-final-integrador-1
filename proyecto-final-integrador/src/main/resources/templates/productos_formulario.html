<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Formulario de Producto</title>
</head>

<body>
	<h1 th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'"></h1>

	<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
		<input type="hidden" th:field="*{idProducto}" />

		<div>
			<label>Código:</label>
			<input type="text" th:field="*{codigo}" />
			<span th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}" style="color:red"></span>
		</div>

		<div>
			<label>Nombre:</label>
			<input type="text" th:field="*{nombre}" />
			<span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color:red"></span>
		</div>

		<div>
			<label>Categoría:</label>
			<select th:field="*{categoria.idCategoria}">
				<option value="">-- Seleccione Categoría --</option>
				<option th:each="cat : ${listaCategorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}">
				</option>
			</select>
			<span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" style="color:red"></span>
		</div>

		<div>
			<label>Proveedor:</label>
			<select th:field="*{proveedor.idProveedor}">
				<option value="">-- Seleccione Proveedor --</option>
				<option th:each="prov : ${listaProveedores}" th:value="${prov.idProveedor}" th:text="${prov.nombre}">
				</option>
			</select>
			<span th:if="${#fields.hasErrors('proveedor')}" th:errors="*{proveedor}" style="color:red"></span>
		</div>

		<div>
			<label>Precio Compra:</label>
			<input type="number" step="0.01" th:field="*{precioCompra}" />
			<span th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}" style="color:red"></span>
		</div>

		<div>
			<label>Precio Venta:</label>
			<input type="number" step="0.01" th:field="*{precioVenta}" />
			<span th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}" style="color:red"></span>
		</div>

		<div>
			<label>Stock Actual:</label>
			<input type="number" th:field="*{stockActual}" />
			<span th:if="${#fields.hasErrors('stockActual')}" th:errors="*{stockActual}" style="color:red"></span>
		</div>

		<div>
			<label>Stock Mínimo:</label>
			<input type="number" th:field="*{stockMinimo}" />
			<span th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}" style="color:red"></span>
		</div>

		<div>
			<label>Fecha Vencimiento:</label>
			<input type="date" th:field="*{fechaVencimiento}" />
			<span th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}"
				style="color:red"></span>
		</div>

		<button type="submit">Guardar Producto</button>
		<a th:href="@{/productos}">Cancelar</a>
	</form>
</body>

</html>
