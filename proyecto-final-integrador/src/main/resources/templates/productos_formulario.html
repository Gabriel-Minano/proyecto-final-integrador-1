<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario de Producto - Conquistadores Farma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet" />
	<style>
		/* Select2 override para que combine con el diseño */
		.select2-container--default .select2-selection--single {
			height: 42px;
			padding: 6px 12px;
			border: 1px solid #dee2e6;
			border-radius: 6px;
		}
		.select2-container--default .select2-selection--single .select2-selection__rendered {
			line-height: 28px;
			color: #343a40;
		}
		.select2-container--default .select2-selection--single .select2-selection__arrow {
			height: 40px;
		}
	</style>
</head>

<body>

	<div class="login-wrapper" style="background: var(--app-bg);">
		<div style="width: 100%; max-width: 700px;">

			<div class="app-header mb-4" style="border-radius: 12px;">
				<div class="header-brand">
					<i class="bi bi-capsule"></i>
					<span>Botica Conquistadores Farma</span>
				</div>
			</div>

			<div class="app-card">
				<div class="app-card-header">
					<i class="bi bi-box-seam-fill"></i>
					<span th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'">Nuevo Producto</span>
				</div>
				<div class="app-card-body">
					<form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="app-form">
						<input type="hidden" th:field="*{idProducto}" />

						<div class="row g-3">
							<div class="col-md-6 mb-3">
								<label class="form-label required">Código</label>
								<input type="text" th:field="*{codigo}" class="form-control" placeholder="Ej. MED-001" />
								<span th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}" class="form-error"></span>
								<div class="form-help">Código único del producto.</div>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Nombre</label>
								<input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre del producto" />
								<span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Categoría</label>
								<select th:field="*{categoria.idCategoria}" class="select-buscador form-select" required>
									<option value="">-- Seleccionar Categoría --</option>
									<option th:each="cat : ${listaCategorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
								</select>
								<span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Proveedor</label>
								<select th:field="*{proveedor.idProveedor}" class="select-buscador form-select" required>
									<option value="">-- Seleccionar Proveedor --</option>
									<option th:each="prov : ${listaProveedores}" th:value="${prov.idProveedor}" th:text="${prov.nombre}"></option>
								</select>
								<span th:if="${#fields.hasErrors('proveedor')}" th:errors="*{proveedor}" class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Precio Compra (S/.)</label>
								<input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" placeholder="0.00" />
								<span th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}" class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Precio Venta (S/.)</label>
								<input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" placeholder="0.00" />
								<span th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}" class="form-error"></span>
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label required">Stock Actual</label>
								<input type="number" th:field="*{stockActual}" class="form-control" placeholder="0" />
								<span th:if="${#fields.hasErrors('stockActual')}" th:errors="*{stockActual}" class="form-error"></span>
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label required">Stock Mínimo</label>
								<input type="number" th:field="*{stockMinimo}" class="form-control" placeholder="0" />
								<span th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}" class="form-error"></span>
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label required">Stock Máximo</label>
								<input type="number" th:field="*{stockMaximo}" class="form-control" placeholder="0" />
								<span th:if="${#fields.hasErrors('stockMaximo')}" th:errors="*{stockMaximo}" class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label required">Fecha Vencimiento</label>
								<input type="date" th:field="*{fechaVencimiento}" class="form-control" />
								<span th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}" class="form-error"></span>
							</div>
							<div class="col-md-6 mb-3" th:if="${producto.idProducto != null}">
								<label class="form-label">Estado del Producto</label>
								<select th:field="*{estado}" class="form-select">
									<option th:value="true">Activo</option>
									<option th:value="false">Inactivo</option>
								</select>
							</div>
							<input th:if="${producto.idProducto == null}" type="hidden" th:field="*{estado}" th:value="true">
						</div>

						<div class="form-actions">
							<a th:href="@{/productos}" class="btn btn-app-secondary">
								<i class="bi bi-x-lg"></i> Cancelar
							</a>
							<button type="submit" class="btn btn-app-primary">
								<i class="bi bi-check-lg"></i> Guardar Producto
							</button>
						</div>
					</form>
				</div>
			</div>

		</div>
	</div>

	<script src="https://code.jquery.com/jquery-4.0.0.min.js"
		integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
	<script>
		$(document).ready(function () {
			$('.select-buscador').select2({
				placeholder: "Escriba para buscar...",
				allowClear: true,
				language: {
					noResults: function () {
						return "No se encontraron resultados";
					}
				}
			});
		});
	</script>
</body>

</html>
