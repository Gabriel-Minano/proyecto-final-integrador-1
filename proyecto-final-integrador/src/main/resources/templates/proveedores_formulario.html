<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Proveedor - Conquistadores Farma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

    <div class="login-wrapper" style="background: var(--app-bg);">

        <div style="width: 100%; max-width: 650px;">

            <!-- Encabezado -->
            <div class="app-header mb-4" style="border-radius: 12px;">
                <div class="header-brand">
                    <i class="bi bi-capsule"></i>
                    <span>Botica Conquistadores Farma</span>
                </div>
            </div>

            <!-- Card Principal -->
            <div class="app-card">

                <div class="app-card-header">
                    <i class="bi bi-building"></i>
                    <span th:text="${proveedor.idProveedor != null} ? 'Editar Proveedor' : 'Nuevo Proveedor'">
                        Nuevo Proveedor
                    </span>
                </div>

                <div class="app-card-body">

                    <form th:action="@{/proveedores/guardar}"
                          th:object="${proveedor}"
                          method="post"
                          class="app-form">

                        <input type="hidden" th:field="*{idProveedor}">
                        <input type="hidden" th:field="*{estado}">

                        <div class="row g-3">

                            <!-- Nombre -->
                            <div class="col-12">
                                <label class="form-label required">
                                    Nombre / Razón Social
                                </label>

                                <input type="text"
                                       autocomplete="off"
                                       th:field="*{nombre}"
                                       class="form-control"
                                       placeholder="Ingrese la razón social del proveedor">

                                <span th:if="${#fields.hasErrors('nombre')}"
                                      th:errors="*{nombre}"
                                      class="form-error">
                                </span>

                                <div class="form-help">
                                    Nombre de la empresa o proveedor.
                                </div>
                            </div>

                            <!-- RUC -->
                            <div class="col-md-6">
                                <label class="form-label required">
                                    RUC
                                </label>

                                <input type="number"
                                       th:field="*{ruc}"
                                       class="form-control"
                                       placeholder="20123456789"
                                       maxlength="11" required>

                                <span th:if="${#fields.hasErrors('ruc')}"
                                      th:errors="*{ruc}"
                                      class="form-error">
                                </span>

                                <div class="form-help">
                                    Debe contener 11 dígitos.
                                </div>
                            </div>

                            <!-- Teléfono -->
                            <div class="col-md-6">
                                <label class="form-label">
                                    Teléfono
                                </label>

                                <input type="number"
                                       autocomplete="off"
                                       th:field="*{telefono}"
                                       class="form-control"
                                       placeholder="987654321"
                                       maxlength="9" required>

                                <span th:if="${#fields.hasErrors('telefono')}"
                                      th:errors="*{telefono}"
                                      class="form-error">
                                </span>
                            </div>

                            <!-- Dirección -->
                            <div class="col-12">
                                <label class="form-label">
                                    Dirección
                                </label>

                                <input type="text"
                                       th:field="*{direccion}"
                                       class="form-control"
                                       placeholder="Ingrese la dirección del proveedor" required>

                                <span th:if="${#fields.hasErrors('direccion')}"
                                      th:errors="*{direccion}"
                                      class="form-error">
                                </span>
                            </div>

                        </div>

                        <!-- Botones -->
                        <div class="form-actions mt-4">

                            <a th:href="@{/proveedores}"
                               class="btn btn-app-secondary">
                                <i class="bi bi-arrow-left"></i>
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-app-primary">
                                <i class="bi bi-floppy-fill"></i>
                                Guardar Proveedor
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
